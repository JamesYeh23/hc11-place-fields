# ============================================================================
# hc11-place-fields — analysis parameters
#
# Every tunable number used anywhere in src/hc11/ lives in this file.
# Analysis functions must not hard-code values that appear here.
#
# Provenance tags on each entry:
#   [CHEN2016]     stated in Chen, Grosmark, Penagos & Wilson 2016, Sci Rep 6:32193
#   [GB2016]       stated in the main text of Grosmark & Buzsaki 2016, Science 351:1440
#   [DATA]         to be confirmed from the .mat files themselves (step 2)
#   [PROVISIONAL]  chosen by us; the Science supplement is not available.
#                  Rationale recorded in docs/decisions.md.
# ============================================================================

schema_version: 1

# ---------------------------------------------------------------------------
# Dataset-level constants
# ---------------------------------------------------------------------------
dataset:
  # Position-tracking sample rate. Confirmed in step 2: timestamps are on an
  # exact, gap-free 25.6 ms grid in all 8 sessions (docs/data_schema.md).
  # Informational only -- code uses the measured Session.position_dt.
  position_rate_hz: 39.0625        # [DATA] confirmed
  # All times in sessInfo are in seconds on the session clock.  [DATA] confirmed
  spike_time_units: seconds        # [DATA] confirmed
  # Cell type is given by separate ID vectors (Spikes.PyrIDs / Spikes.IntIDs),
  # not by per-unit labels, so no label strings are needed here.

# ---------------------------------------------------------------------------
# Preprocessing of the raw session (analysis layer; the loader stays faithful)
# ---------------------------------------------------------------------------
preprocess:
  # Drop spikes and clip state intervals after sessDuration. Affects only
  # Gatsby_08022013 (263,976 spikes, 4.67%). See decision D3.1.
  truncate_to_session: true        # [PROVISIONAL] James's decision, 2026-09-30
  # Drop zero-length state intervals. Affects only Achilles_11012013 (one REM
  # row, [13281, 13281]). See decision D3.2.
  drop_zero_length_state_intervals: true   # [PROVISIONAL] James's decision

# ---------------------------------------------------------------------------
# Track geometry
# ---------------------------------------------------------------------------
track:
  # Build the track extent from the observed OneDLocation range per session
  # rather than from an assumed track length. Required on the circular maze,
  # where the observed range (2.84-2.90 m) disagrees with the circumference
  # implied by the documented 1 m diameter (3.14 m). See decision D3.3.
  use_observed_range: true         # [PROVISIONAL]

# ---------------------------------------------------------------------------
# Behaviour / running-period definition
# ---------------------------------------------------------------------------
behavior:
  # Start from the authors' own definition of track running: the samples where
  # OneDLocation is defined. Required for 1-D rate maps -- a sample without a
  # linearised position has no spatial bin. See decision D3.4.
  require_linearized: true         # [GB2016] implicit in the released data
  # Speed threshold separating running from immobility, applied on top of the
  # authors' mask. NOT a formality: it removes 3-11% of the authors' mask in
  # 3 sessions but 31-52% in the other 5 (docs/decisions.md D3.4).
  speed_threshold_cm_s: 15.0       # [CHEN2016]
  # Half-width of the Gaussian used to smooth the speed trace before
  # thresholding, in seconds. Unsmoothed speed from 39 Hz tracking is noisy
  # enough to fragment running epochs.
  speed_smoothing_sigma_s: 0.1     # [PROVISIONAL]
  # Running epochs shorter than this are discarded.
  min_run_epoch_s: 0.5             # [PROVISIONAL]
  # Gaps shorter than this between two running epochs are bridged.
  max_run_gap_s: 0.2               # [PROVISIONAL]

# ---------------------------------------------------------------------------
# Unit selection
# ---------------------------------------------------------------------------
units:
  # Only pyramidal cells enter place-field and decoding analyses.
  include_types: [pyramidal]       # [GB2016]
  # Minimum spike count during the MAZE epoch for a unit to be considered.
  min_spikes_maze: 100             # [PROVISIONAL]
  # Units whose mean MAZE firing rate exceeds this are treated as mislabelled
  # interneurons and flagged (not silently dropped).
  max_mean_rate_hz: 5.0            # [PROVISIONAL]

# ---------------------------------------------------------------------------
# Place fields (step 4)
# ---------------------------------------------------------------------------
place_fields:
  bin_size_cm: 10.0                # [CHEN2016]
  # Gaussian smoothing applied to both the spike-count and occupancy maps
  # before taking their ratio. Chen et al. describe smoothing over ~5 bins;
  # we read that as a kernel of ~5 bins full width, i.e. sigma ~1 bin.
  smoothing_sigma_bins: 1.0        # [CHEN2016] / [PROVISIONAL] interpretation
  smoothing_truncate_bins: 4.0     # [PROVISIONAL]
  # Spatial bins with less than this much occupancy are treated as unvisited
  # (NaN) rather than as zero-rate.
  min_occupancy_s: 0.1             # [PROVISIONAL]
  # Running directions are mapped separately.
  separate_directions: true        # [GB2016]
  # --- shuffle test for spatial information ---
  shuffle:
    # Circular shift of the spike train relative to position, within the
    # running samples only (compressed running time). See fields.shuffle_test.
    n_shuffles: 500                # [PROVISIONAL]
    alpha: 0.05                    # [PROVISIONAL]
    random_seed: 20160310          # [PROVISIONAL]
  # --- place-cell inclusion criteria ---
  criteria:
    min_spikes: 50                 # [PROVISIONAL] spikes during running, per direction
    min_peak_rate_hz: 1.0          # [PROVISIONAL]
    # Spatial information must beat the shuffle null at `shuffle.alpha`; no
    # absolute bits/spike threshold is imposed, because the paper gives none
    # and an absolute cut would depend on bin size and smoothing.
    # A contiguous run of bins above this fraction of the peak rate counts as
    # a field.
    field_threshold_frac_of_peak: 0.20     # [PROVISIONAL]
    min_field_width_cm: 10.0       # [PROVISIONAL]
    max_field_width_cm: 120.0      # [PROVISIONAL]
    # Split-half (odd vs even laps) correlation. Reported both with and without
    # this criterion, since the paper states no threshold.
    min_stability_r: 0.3           # [PROVISIONAL]
  # Target from the paper, used as a QC check, not as a filter.
  expected_total_place_cells: 491  # [GB2016]

# ---------------------------------------------------------------------------
# Bayesian decoding during running (step 5)
# ---------------------------------------------------------------------------
decoding:
  # Time bin for decoding running behaviour. (Phase 2 replay decoding uses
  # 20 ms bins; that is out of scope here.)
  time_bin_s: 0.25                 # [PROVISIONAL]
  # Memoryless Poisson decoder with a spatially uniform prior.
  prior: uniform                   # [CHEN2016]
  # Small constant added to tuning curves so that a zero-rate bin cannot
  # veto a position outright.
  rate_floor_hz: 0.01              # [PROVISIONAL]
  # Cross-validation scheme: tuning curves are estimated on all laps but the
  # held-out one, then used to decode that lap.
  cv_scheme: leave_one_lap_out     # [PROVISIONAL]
  # Decoding bins containing fewer than this many spikes across the ensemble
  # are reported as undecodable rather than being assigned a position.
  min_spikes_per_bin: 1            # [PROVISIONAL]
  # Minimum number of simultaneously recorded place cells for a session to be
  # decoded at all.
  min_units_for_decoding: 10       # [PROVISIONAL]

# ---------------------------------------------------------------------------
# Lap detection on the linear track
# ---------------------------------------------------------------------------
laps:
  # Laps are segmented on the AUTHORS' mask blocks (OneDLocation defined), not
  # on the speed-filtered mask: a traversal that briefly dips below the speed
  # threshold would otherwise fragment into several sub-threshold laps. The
  # speed filter is applied afterwards, when occupancy and spikes are counted.
  # See decision D4.1.
  segment_on: authors_mask         # [PROVISIONAL] James's decision, 2026-09-30
  # Smoothing of the linearised position before differentiating for direction.
  position_smoothing_sigma_s: 0.25 # [PROVISIONAL]
  # Hysteresis threshold on the along-track velocity: direction flips only when
  # the animal clearly moves the other way, so a wobble is not a turnaround.
  direction_threshold_cm_s: 5.0    # [PROVISIONAL]
  # A traversal must cover this fraction of the track extent, end to end, in one
  # direction to count as a lap.
  min_coverage_frac: 0.5           # [PROVISIONAL]
  min_lap_duration_s: 0.5          # [PROVISIONAL]
  max_lap_duration_s: 60.0         # [PROVISIONAL]

# ---------------------------------------------------------------------------
# Output / reproducibility
# ---------------------------------------------------------------------------
output:
  figure_format: png
  figure_dpi: 150
  # Every figure gets a sidecar <name>.json with the parameters and git commit.
  write_sidecar_json: true
  random_seed: 20160310            # [PROVISIONAL] (Science publication date)

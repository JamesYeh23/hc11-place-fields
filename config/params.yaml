# ============================================================================
# hc11-place-fields — analysis parameters
#
# Every tunable number used anywhere in src/hc11/ lives in this file.
# Analysis functions must not hard-code values that appear here.
#
# Provenance tags on each entry:
#   [CHEN2016]     stated in Chen, Grosmark, Penagos & Wilson 2016, Sci Rep 6:32193
#   [GB2016]       stated in the main text of Grosmark & Buzsaki 2016, Science 351:1440
#   [DATA]         to be confirmed from the .mat files themselves (step 2)
#   [PROVISIONAL]  chosen by us; the Science supplement is not available.
#                  Rationale recorded in docs/decisions.md.
# ============================================================================

schema_version: 1

# ---------------------------------------------------------------------------
# Dataset-level constants
# ---------------------------------------------------------------------------
dataset:
  # Position-tracking sample rate. Confirmed in step 2: timestamps are on an
  # exact, gap-free 25.6 ms grid in all 8 sessions (docs/data_schema.md).
  # Informational only -- code uses the measured Session.position_dt.
  position_rate_hz: 39.0625        # [DATA] confirmed
  # All times in sessInfo are in seconds on the session clock.  [DATA] confirmed
  spike_time_units: seconds        # [DATA] confirmed
  # Cell type is given by separate ID vectors (Spikes.PyrIDs / Spikes.IntIDs),
  # not by per-unit labels, so no label strings are needed here.

# ---------------------------------------------------------------------------
# Preprocessing of the raw session (analysis layer; the loader stays faithful)
# ---------------------------------------------------------------------------
preprocess:
  # Drop spikes and clip state intervals after sessDuration. Affects only
  # Gatsby_08022013 (263,976 spikes, 4.67%). See decision D3.1.
  truncate_to_session: true        # [PROVISIONAL] James's decision, 2026-09-30
  # Drop zero-length state intervals. Affects only Achilles_11012013 (one REM
  # row, [13281, 13281]). See decision D3.2.
  drop_zero_length_state_intervals: true   # [PROVISIONAL] James's decision

# ---------------------------------------------------------------------------
# Track geometry
# ---------------------------------------------------------------------------
track:
  # Build the track extent from the observed OneDLocation range per session
  # rather than from an assumed track length. Required on the circular maze,
  # where the observed range (2.84-2.90 m) disagrees with the circumference
  # implied by the documented 1 m diameter (3.14 m). See decision D3.3.
  use_observed_range: true         # [PROVISIONAL]

# ---------------------------------------------------------------------------
# Behaviour / running-period definition
# ---------------------------------------------------------------------------
behavior:
  # Start from the authors' own definition of track running: the samples where
  # OneDLocation is defined. Required for 1-D rate maps -- a sample without a
  # linearised position has no spatial bin. See decision D3.4.
  require_linearized: true         # [GB2016] implicit in the released data
  # Speed threshold separating running from immobility, applied on top of the
  # authors' mask. NOT a formality: it removes 3-11% of the authors' mask in
  # 3 sessions but 31-52% in the other 5 (docs/decisions.md D3.4).
  speed_threshold_cm_s: 15.0       # [CHEN2016]
  # Half-width of the Gaussian used to smooth the speed trace before
  # thresholding, in seconds. Unsmoothed speed from 39 Hz tracking is noisy
  # enough to fragment running epochs.
  speed_smoothing_sigma_s: 0.1     # [PROVISIONAL]
  # Running epochs shorter than this are discarded.
  min_run_epoch_s: 0.5             # [PROVISIONAL]
  # Gaps shorter than this between two running epochs are bridged.
  max_run_gap_s: 0.2               # [PROVISIONAL]

# ---------------------------------------------------------------------------
# Unit selection
# ---------------------------------------------------------------------------
units:
  # Only pyramidal cells enter place-field and decoding analyses.
  include_types: [pyramidal]       # [GB2016]
  # Minimum spike count during the MAZE epoch for a unit to be considered.
  min_spikes_maze: 100             # [PROVISIONAL]
  # Units whose mean MAZE firing rate exceeds this are treated as mislabelled
  # interneurons and flagged (not silently dropped).
  max_mean_rate_hz: 5.0            # [PROVISIONAL]

# ---------------------------------------------------------------------------
# Place fields (step 4)
# ---------------------------------------------------------------------------
place_fields:
  bin_size_cm: 10.0                # [CHEN2016]
  # Gaussian smoothing applied to both the spike-count and occupancy maps
  # before taking their ratio. Chen et al. describe smoothing over ~5 bins;
  # we read that as a kernel of ~5 bins full width, i.e. sigma ~1 bin.
  smoothing_sigma_bins: 1.0        # [CHEN2016] / [PROVISIONAL] interpretation
  smoothing_truncate_bins: 4.0     # [PROVISIONAL]
  # Spatial bins with less than this much occupancy are treated as unvisited
  # (NaN) rather than as zero-rate.
  min_occupancy_s: 0.1             # [PROVISIONAL]
  # Running directions are mapped separately.
  separate_directions: true        # [GB2016]
  # --- shuffle test for spatial information ---
  shuffle:
    # Circular shift of the spike train relative to position, within the
    # running samples only (compressed running time). See fields.shuffle_test.
    n_shuffles: 500                # [PROVISIONAL]
    alpha: 0.05                    # [PROVISIONAL]
    random_seed: 20160310          # [PROVISIONAL]
  # --- place-cell inclusion criteria ---
  criteria:
    min_spikes: 50                 # [PROVISIONAL] spikes during running, per direction
    min_peak_rate_hz: 1.0          # [PROVISIONAL]
    # Spatial information must beat the shuffle null at `shuffle.alpha`; no
    # absolute bits/spike threshold is imposed, because the paper gives none
    # and an absolute cut would depend on bin size and smoothing.
    # A contiguous run of bins above this fraction of the peak rate counts as
    # a field.
    field_threshold_frac_of_peak: 0.20     # [PROVISIONAL]
    min_field_width_cm: 10.0       # [PROVISIONAL]
    # Maximum field width as a FRACTION of the usable track extent, so that the
    # 1.6 m, 2 m and circular tracks are treated consistently (a fixed 120 cm cap
    # was 75% of a 1.6 m track but only 41% of a 2.9 m ring). See decision D5.2.
    max_field_width_frac: 0.75     # [PROVISIONAL] James's decision, 2026-10-05
    # Split-half (odd vs even laps) correlation. Reported both with and without
    # this criterion, since the paper states no threshold.
    min_stability_r: 0.3           # [PROVISIONAL]
  # Target from the paper, used as a QC check, not as a filter.
  expected_total_place_cells: 491  # [GB2016]

# ---------------------------------------------------------------------------
# Bayesian decoding during running (step 5)
# ---------------------------------------------------------------------------
decoding:
  # Time bin for decoding running behaviour.
  time_bin_s: 0.25                 # [CHEN2016]
  # Every bin size the analysis is run at. 250 ms is Chen et al.'s running bin;
  # 20 ms is the bin Grosmark & Buzsaki use for ripple sequence scoring, run
  # here on running data to show what that bin size costs when most cells
  # contribute no spikes.
  time_bins_s: [0.25, 0.02]        # [CHEN2016] / [GB2016]
  # Memoryless Poisson decoder with a spatially uniform prior.
  prior: uniform                   # [CHEN2016]
  # Small constant added to tuning curves so that a zero-rate bin cannot
  # veto a position outright.
  rate_floor_hz: 0.01              # [PROVISIONAL]
  # Cross-validation scheme: tuning curves are estimated on all laps but the
  # held-out one, then used to decode that lap.
  cv_scheme: leave_one_lap_out     # [PROVISIONAL]
  # Decoding bins containing fewer than this many spikes across the ensemble
  # are reported as undecodable rather than being assigned a position.
  min_spikes_per_bin: 1            # [PROVISIONAL]
  # Minimum number of simultaneously recorded place cells for a session to be
  # decoded at all.
  min_units_for_decoding: 10       # [PROVISIONAL]
  # Chance baseline: permute which tuning curve belongs to which cell and
  # re-decode. Preserves both the spike counts and the set of fields, and
  # destroys only the correspondence between them.
  n_chance_shuffles: 20            # [PROVISIONAL]
  # Error against ensemble size (Chen et al. emphasise this dependence).
  ensemble_sizes: [5, 10, 20, 30, 40, 60, 80]   # [PROVISIONAL]
  n_ensemble_draws: 10             # [PROVISIONAL]
  # Decode each direction against its own fields; also report a
  # direction-agnostic decoder built from fields merged across directions.
  report_direction_merged: true    # [PROVISIONAL]

# ---------------------------------------------------------------------------
# Lap detection on the linear track
# ---------------------------------------------------------------------------
laps:
  # Laps are segmented on the AUTHORS' mask blocks (OneDLocation defined), not
  # on the speed-filtered mask: a traversal that briefly dips below the speed
  # threshold would otherwise fragment into several sub-threshold laps. The
  # speed filter is applied afterwards, when occupancy and spikes are counted.
  # See decision D4.1.
  segment_on: authors_mask         # [PROVISIONAL] James's decision, 2026-09-30
  # Smoothing of the linearised position before differentiating for direction.
  position_smoothing_sigma_s: 0.25 # [PROVISIONAL]
  # Hysteresis threshold on the along-track velocity: direction flips only when
  # the animal clearly moves the other way, so a wobble is not a turnaround.
  direction_threshold_cm_s: 5.0    # [PROVISIONAL]
  # A traversal must cover this fraction of the track extent, end to end, in one
  # direction to count as a lap.
  min_coverage_frac: 0.5           # [PROVISIONAL]
  min_lap_duration_s: 0.5          # [PROVISIONAL]
  max_lap_duration_s: 60.0         # [PROVISIONAL]

# ---------------------------------------------------------------------------
# Output / reproducibility
# ---------------------------------------------------------------------------
output:
  figure_format: png
  figure_dpi: 150
  # Every figure gets a sidecar <name>.json with the parameters and git commit.
  write_sidecar_json: true
  random_seed: 20160310            # [PROVISIONAL] (Science publication date)

# ---------------------------------------------------------------------------
# Sequence scores for candidate events (Phase 2, step 7)
# ---------------------------------------------------------------------------
# --- Step 9b: ensemble subsets (the paper's Fig. 4D) -------------------------
subsets:
  # Grosmark & Buzsaki divide place cells "into equal subgroups by either
  # 'off-line' sleep-firing rate or ripple-rate gain" and repeat the decoding
  # analysis for each group. Which sleep is not stated. We measure the rate over
  # the whole PRE and POST epochs, so it is a property of the cell across sleep
  # rather than of the state scoring; the non-REM-only split is reported beside
  # it as a robustness check, not as an alternative result.
  offline_rate_window: epochs      # [PROVISIONAL] "epochs" or "nrem"
  # The control: equal splits of the same ensemble made at random. A difference
  # between two halves is not evidence until the spread of differences between
  # arbitrary halves is known. 20 draws give a finest two-sided p of 1/21.
  n_random_splits: 20              # [PROVISIONAL]
  random_split_seed: 20160325      # [PROVISIONAL] (Science issue date)

sequences:
  # Decoding bin for candidate events. Chen et al. bin quiet-waking and
  # slow-wave-sleep candidate events at 20 ms.
  time_bin_s: 0.02               # [CHEN2016]
  # Bins with no spikes are dropped before scoring (their posterior describes
  # the place fields, not the animal), so this is a floor on *kept* bins.
  # Chen et al. require more than five bins.
  min_bins: 5                    # [CHEN2016]
  # Shuffles per event per shuffle kind. 500 gives the z-score a null with a
  # standard error of about 3% of its own standard deviation, which is finer
  # than the differences being compared.
  n_shuffles: 500                # [PROVISIONAL]
  shuffle_seed: 20160310         # [PROVISIONAL] (Science publication date)
  # Rate floor for the Poisson decoder, as in step 5b: one spike from a cell
  # whose estimated rate is zero somewhere must not veto that position.
  rate_floor_hz: 0.01            # [PROVISIONAL] matches decoding
  # A running direction needs this many laps before its place fields are used
  # as a decoding template. Achilles_11012013's "pos" direction has one lap;
  # see D7.3 for why a noise template is worse than no template here.
  min_laps_per_direction: 5      # [PROVISIONAL]
  # Identity-shuffle control: permute which cell owns which place field.
  identity_shuffle_seed: 7351    # [PROVISIONAL]
  # MAZE running positive control. At ~30 cm/s a window matched to an event
  # (about 200 ms) covers roughly one position bin, so it cannot show a
  # trajectory whatever the decoder does; both lengths are reported.
  running_window_s: [0.2, 2.0]   # [PROVISIONAL]
  # Significance threshold quoted alongside the distributions. Chen et al. use
  # a one-sided z of 1.65 for their sequence score.
  significance_z: 1.65           # [CHEN2016]
  # PRE-vs-POST test: subsample PRE to POST's event count this many times and
  # report the spread, so the unequal-n objection is answered rather than
  # argued.
  n_subsamples: 200              # [PROVISIONAL]
  subsample_seed: 11012013       # [PROVISIONAL]

# ---------------------------------------------------------------------------
# Local field potential (LFP) files
# ---------------------------------------------------------------------------
lfp:
  # The .eeg recordings are tens of GB and live outside the repository. Path
  # resolution: $HC11_LFP_DIR -> <repo>/data/raw/lfp -> <repo>/../hc-11_LFP.
  # Both <session>.eeg and <session>.xml must be present, flat or in a
  # <session>/ subfolder.
  dir_env_var: HC11_LFP_DIR
  # Tolerance when checking the .eeg duration against sessInfo.sessDuration.
  # A file that is not a whole number of frames fails regardless: that is the
  # signature of a wrong channel count, which mis-strides every sample.
  size_check_tolerance_s: 1.0    # [PROVISIONAL]
  # The .eeg may run LONGER than sessDuration without that being an error: the
  # authors sometimes defined a session shorter than what they recorded, and
  # every analysis window ends at sessDuration. A file SHORTER than the session
  # stays fatal, because an epoch would then read past the end of the data.
  # The tolerance above applies to the short direction only. See D8.7.
  #
  # Sessions where the XML's nChannels does not describe the .eeg. Taken from
  # the data, with the stride evidence in D8.6, and deliberately a declared
  # per-session exception rather than a heuristic.
  channel_count_override:
    Gatsby_08022013: 134         # [DATA] XML says 141; stride test says 134

  # --- Channel selection for ripple detection (step 6a-2) ---
  channel_selection:
    # Bands used to describe a channel. Only `ripple` decides the selection;
    # delta and theta are diagnostics -- a channel elevated in every band is
    # noisy rather than in the pyramidal layer.
    bands:
      delta: [1.0, 4.0]            # [PROVISIONAL] diagnostic only
      theta: [5.0, 11.0]           # [PROVISIONAL] diagnostic only
      ripple: [150.0, 300.0]       # [CHEN2016]
    # Ranking 134 channels does not need the whole recording. A fixed,
    # deterministic sample of scored non-REM spread evenly through PRE and
    # POST; 40 x 15 s = 10 min. No seed, because the sampling is not random.
    window_s: 15.0                 # [PROVISIONAL]
    n_windows: 40                  # [PROVISIONAL]
    # Channels dropped on top of the XML's own skip flags, after inspecting
    # the profile. Empty until a channel earns an entry, with the reason in
    # docs/decisions.md.
    skip_channels: []              # [PROVISIONAL]
    # Diagnostic figure: how many of the strongest ripple-band peaks to show,
    # and how much context either side of each.
    n_example_events: 9            # [PROVISIONAL]
    example_pad_ms: 250.0          # [PROVISIONAL]

# ---------------------------------------------------------------------------
# Candidate-event detection (Phase 2, step 6)
# ---------------------------------------------------------------------------
events:
  # Where events may be detected, per epoch.
  states:
    # PRE and POST: scored non-REM sleep from sessInfo.Epochs.
    sleep_state: NREM              # [GB2016]
    # MAZE: quiet wakefulness, i.e. immobility on the track.
    maze_immobility_speed_cm_s: 2.0        # [CHEN2016]
    speed_smoothing_sigma_s: 0.1   # [PROVISIONAL] as in behavior.speed_cm_s
    # Brief apparent movement shorter than this does not break an immobility
    # period. Without it, tracking jitter fragments every quiet period into
    # sub-threshold pieces and the MAZE epoch yields almost no searchable time.
    max_immobility_gap_s: 0.5      # [PROVISIONAL]
    # Immobility periods shorter than this are not searched: they cannot
    # contain a whole event plus the baseline around it.
    min_immobility_s: 0.5          # [PROVISIONAL]

  # Population-synchrony (multi-unit activity) detector, spikes only.
  mua:
    unit_kind: pyr                 # [GB2016] pyramidal cells only
    bin_ms: 1.0                    # [PROVISIONAL]
    # Gaussian smoothing of the 1 ms population-rate trace. 10 ms is short
    # enough to keep a 50-100 ms event sharp and long enough that the trace is
    # not dominated by single-spike noise.
    smoothing_sigma_ms: 10.0       # [PROVISIONAL]
    threshold_high_sd: 3.0         # [CHEN2016] peak must clear this
    threshold_low_sd: 1.0          # [CHEN2016] boundaries extend to this
    min_duration_ms: 30            # [PROVISIONAL]
    max_duration_ms: 400           # [GB2016] SPW-Rs last 50-400 ms
    merge_gap_ms: 30               # [PROVISIONAL]
    # Spike-jitter null (D6.5): displace each cell's spikes independently by
    # U(-w, +w). Must exceed the event duration (57-68 ms here) so that
    # within-event co-firing is destroyed, while staying short enough that the
    # slow population envelope survives.
    jitter_window_ms: 100          # [PROVISIONAL]
    n_jitter_repeats: 5            # [PROVISIONAL]

  # What counts as an event worth decoding in step 7.
  # --- Sharp-wave ripple detection from the LFP (step 6b) ---
  ripples:
    # Chen et al. screen candidate events on "hippocampal LFP ripple band
    # (150-300 Hz) power combined with hippocampal multi-unit activity
    # (threshold > mean + 3SD)". The band and the high threshold are theirs.
    band: [150.0, 300.0]           # [CHEN2016]
    threshold_high_sd: 3.0         # [CHEN2016]
    # The envelope is smoothed before thresholding: a single cycle's trough can
    # otherwise split one ripple into two events. 8 ms is about 1.5 ripple
    # cycles at 190 Hz, short enough not to blur event boundaries.
    smoothing_sigma_ms: 8.0        # [PROVISIONAL]
    # Boundaries extend out to 1 SD, as in the MUA detector, so that duration
    # describes the whole event rather than the part above the peak threshold.
    threshold_low_sd: 1.0          # [PROVISIONAL] matches events.mua
    # Chen et al. give SPW-R duration as 50-400 ms. The floor here is lower
    # because it applies at the 1 SD boundary, not at the ripple itself.
    min_duration_ms: 20            # [PROVISIONAL]
    max_duration_ms: 400           # [CHEN2016]
    merge_gap_ms: 15               # [PROVISIONAL]
    # Which ranking from step 6a-2 supplies the primary detection channel.
    # Level, i.e. mean envelope: it is the criterion Chen et al. state, and
    # where the two rankings differ most it is the marginally better of the
    # two. See D6.17 for the evidence; the difference is small either way.
    primary_ranking: level         # [PROVISIONAL] see D6.17
    # Shanks whose two rankings land more than this many channels apart are
    # detected on separately: that is where the ranking could change what is
    # found rather than move it by one contact (20 um).
    stress_gap_channels: 2         # [PROVISIONAL]
    # Two events count as the same event if they overlap or peak within this.
    match_window_ms: 50.0          # [PROVISIONAL] matches the 6c cross-check
    # --- multi-shank consistency (reported per event, never filtered on) ---
    # A real sharp-wave ripple appears across neighbouring recording sites
    # within a few ms; a local artifact does not.
    support_window_ms: 20.0        # [PROVISIONAL]
    support_z: 2.0                 # [PROVISIONAL]
    # Comparison channels' baselines are estimated from a sample of the same
    # state rather than from a full-recording pass: a baseline is a summary
    # statistic and 11 extra full passes buy nothing.
    baseline_window_s: 15.0        # [PROVISIONAL]
    baseline_n_windows: 40         # [PROVISIONAL]
    example_pad_ms: 250.0          # [PROVISIONAL]

  decodable:
    min_active_cells: 5            # [PROVISIONAL]
    min_active_fraction: 0.10      # [PROVISIONAL]
